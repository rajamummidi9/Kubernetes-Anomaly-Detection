# PromQL templates used by the metrics collector.
# Placeholders: {namespace}, {service}, {pod}, {window}

cpu_usage: |
  sum by (namespace, pod) (
    rate(container_cpu_usage_seconds_total{namespace=~"{namespace}", container!="", container!="POD"}[5m])
  )

memory_usage: |
  sum by (namespace, pod) (
    container_memory_working_set_bytes{namespace=~"{namespace}", container!="", container!="POD"}
  )

pod_restarts: |
  sum by (namespace, pod) (
    increase(kube_pod_container_status_restarts_total{namespace=~"{namespace}"}[{window}])
  )

http_request_rate: |
  sum by (namespace, service) (
    rate(http_server_request_duration_seconds_count{namespace=~"{namespace}"}[5m])
  )

http_error_rate: |
  sum by (namespace, service) (
    rate(http_server_request_duration_seconds_count{namespace=~"{namespace}", http_response_status_code=~"5.."}[5m])
  )
  /
  clamp_min(
    sum by (namespace, service) (
      rate(http_server_request_duration_seconds_count{namespace=~"{namespace}"}[5m])
    ),
    1e-9
  )

http_latency_p95: |
  histogram_quantile(
    0.95,
    sum by (le, namespace, service) (
      rate(http_server_request_duration_seconds_bucket{namespace=~"{namespace}"}[5m])
    )
  )

node_cpu_saturation: |
  1 - avg by (instance) (
    rate(node_cpu_seconds_total{mode="idle"}[5m])
  )

node_memory_pressure: |
  (
    node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes
  ) / node_memory_MemTotal_bytes

pending_pods: |
  sum by (namespace) (
    kube_pod_status_phase{phase="Pending", namespace=~"{namespace}"}
  )

oom_kills: |
  sum by (namespace, pod) (
    increase(container_oom_events_total{namespace=~"{namespace}"}[{window}])
  )
